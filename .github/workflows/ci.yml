name: feature-factory-ai
on: [push, pull_request]
jobs:
  contracts:
    runs-on: '${{ matrix.os }}'
    strategy:
      # Every platform reports its own result; one failure never hides the others.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install uv
      - run: uv sync --locked --all-packages --extra dev
      - run: uv run --locked python tools/check_boundaries.py
      - run: uv run --locked python -m ruff check .
      - run: uv run --locked python -m ruff format --check .
      - run: uv run --locked python -m mypy
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python tools/build_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.python }}
          path: .hypothesis/
