[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-usage"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Token usage pricing: dated model rate cards and API-equivalent cost"
requires-python = ">=3.12"
dependencies = ["sdd-core==0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
