<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feature Factory AI</title>
    <meta name="darkreader-lock" />
    <script src="/preferences.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/pipeline.css" />
    <link rel="stylesheet" href="/css/office.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="rail" aria-label="Feature Factory">
        <div class="brand">
          <span class="logo" aria-hidden="true">ff</span>
          <div>
            <strong>Feature Factory</strong>
            <small data-i18n="brand.tagline">детерминированный движок</small>
          </div>
        </div>
        <section class="project-switch" aria-labelledby="project-label">
          <span id="project-label" class="eyebrow" data-i18n="project.label"
            >Проект</span
          >
          <div class="project-row">
            <select
              id="project-select"
              data-i18n-aria-label="project.label"
            ></select>
            <button
              id="project-edit"
              type="button"
              class="icon-button"
              data-i18n-title="project.edit"
              data-i18n-aria-label="project.edit"
            >
              ⚙
            </button>
            <button
              id="project-add"
              type="button"
              class="icon-button"
              data-i18n-title="project.add"
              data-i18n-aria-label="project.add"
            >
              ＋
            </button>
          </div>
          <p id="project-path" class="path"></p>
        </section>
        <nav id="nav" data-i18n-aria-label="nav.label"></nav>
        <div class="rail-foot">
          <button id="help" type="button" class="ghost" data-i18n="help.open">
            Как пользоваться
          </button>
          <div class="rail-prefs">
            <select id="language-select" data-i18n-aria-label="prefs.language">
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
            <select id="theme-select" data-i18n-aria-label="prefs.theme">
              <option value="light" data-i18n="prefs.light">Светлая</option>
              <option value="dark" data-i18n="prefs.dark">Тёмная</option>
              <option value="system" data-i18n="prefs.system">Системная</option>
            </select>
          </div>
          <button
            id="about"
            type="button"
            class="ghost version-button"
          ></button>
          <p id="update-note" class="update-note" hidden>
            <span data-i18n="app.updateShort">Есть обновление</span>
            <button
              id="update-restart"
              type="button"
              class="primary-soft"
              data-i18n="app.restart"
            >
              Перезапустить
            </button>
          </p>
          <button
            id="close-app"
            type="button"
            class="ghost"
            data-i18n="app.menu"
          >
            Приложение…
          </button>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button
            id="nav-back"
            type="button"
            class="icon-button"
            data-i18n-aria-label="nav.back"
            data-i18n-title="nav.back"
          >
            ←
          </button>
          <h1 id="page-title"></h1>
          <div class="queue" id="queue-control">
            <span id="queue-status" class="status-dot"></span>
            <button id="queue-toggle" type="button"></button>
          </div>
          <dl id="meters" class="meters"></dl>
          <button
            id="notifications"
            type="button"
            class="icon-button bell"
            data-i18n-aria-label="notify.title"
            data-i18n-title="notify.title"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16Zm4 4h4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
                stroke-linecap="round"
              /></svg
            ><span id="notify-badge" class="bell-badge" hidden></span>
          </button>
          <button
            id="new-task"
            type="button"
            class="primary"
            data-i18n="task.new"
          >
            Новая задача
          </button>
        </header>
        <div id="banner" class="banner" hidden></div>
        <main id="view"></main>
      </div>
    </div>
  </body>
</html>
